<html lang="id">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1" />

        <style>
            :root {
                --red: #e12b4b;
                --ink: #1f2937;
                --muted: #667085;
                --line: #e6e8ec;
                --blue: #315fd4;
                --amber: #a15c08;
                --amberbg: #fff7e8;
                --green: #0a7a55;
                --greenbg: #ecfdf3;
            }
            * {
                box-sizing: border-box;
            }
            body {
                margin: 0;
                font:
                    12px/1.45 Inter,
                    ui-sans-serif,
                    -apple-system,
                    BlinkMacSystemFont,
                    "Segoe UI",
                    sans-serif;
                color: var(--ink);
                background: #f6f7f9;
            }
            button {
                font: inherit;
                cursor: pointer;
            }
            .hidden {
                display: none !important;
            }
            .proto {
                position: sticky;
                top: 0;
                z-index: 99;
                background: #fff7cc;
                border-bottom: 1px solid #ead36d;
                padding: 7px 16px;
                display: flex;
                justify-content: space-between;
                gap: 12px;
                align-items: center;
                color: #6b5600;
                font-size: 11px;
            }
            .proto .nav {
                display: flex;
                gap: 6px;
                flex-wrap: wrap;
            }
            .pbtn {
                border: 1px solid #d8bf54;
                background: #fffdf5;
                border-radius: 6px;
                padding: 5px 8px;
                font-weight: 700;
                color: #6b5600;
            }
            .pbtn.active {
                background: #6b5600;
                color: #fff;
            }
            .topline {
                height: 28px;
                background: #f1f3f6;
                border-bottom: 1px solid #e5e7eb;
            }
            .inner,
            .shell {
                max-width: 1280px;
                margin: auto;
            }
            .topline .inner {
                height: 28px;
                display: flex;
                justify-content: space-between;
                align-items: center;
                padding: 0 22px;
                color: #737b88;
                font-size: 10px;
            }
            .header {
                height: 72px;
                background: #fff;
                border-bottom: 1px solid var(--line);
            }
            .header .inner {
                height: 100%;
                display: flex;
                justify-content: space-between;
                align-items: center;
                padding: 0 22px;
            }
            .brand {
                display: flex;
                gap: 10px;
                align-items: center;
            }
            .logo {
                width: 28px;
                height: 28px;
                border-radius: 50%;
                background: var(--red);
                color: #fff;
                display: grid;
                place-items: center;
                font-weight: 900;
            }
            .brand b {
                font-size: 15px;
            }
            .brand span {
                color: var(--red);
            }
            .header-left {
                display: flex;
                align-items: center;
            }
            .mainnav {
                display: flex;
                gap: 24px;
                margin-left: 34px;
            }
            .mainnav a {
                height: 72px;
                display: flex;
                align-items: center;
                font-weight: 700;
                color: #505968;
                border-bottom: 3px solid transparent;
            }
            .mainnav a.active {
                border-color: var(--red);
                color: #111827;
            }
            .user {
                display: flex;
                align-items: center;
                gap: 9px;
            }
            .avatar {
                width: 32px;
                height: 32px;
                border-radius: 50%;
                background: #e8eaee;
                display: grid;
                place-items: center;
                font-weight: 800;
            }
            .user small {
                display: block;
                color: #8a93a2;
                font-size: 9px;
            }
            .shell {
                padding: 24px 22px 60px;
            }
            .breadcrumb {
                color: #4d67c9;
                font-size: 10px;
                margin-bottom: 14px;
            }
            .title-row {
                display: flex;
                justify-content: space-between;
                gap: 16px;
                align-items: flex-start;
                margin-bottom: 14px;
            }
            .title-row h1 {
                font-size: 18px;
                margin: 0 0 3px;
            }
            .title-row p {
                margin: 0;
                color: var(--muted);
            }
            .actions {
                display: flex;
                gap: 8px;
                align-items: center;
                flex-wrap: wrap;
            }
            .btn {
                display: inline-flex;
                align-items: center;
                justify-content: center;
                padding: 7px 10px;
                border: 1px solid #d0d5dd;
                background: #fff;
                border-radius: 6px;
                color: #344054;
                font-weight: 700;
                font-size: 10px;
            }
            .btn.primary {
                background: var(--red);
                border-color: var(--red);
                color: #fff;
            }
            .notice {
                background: #f4f7ff;
                border: 1px solid #cad6f8;
                border-radius: 7px;
                padding: 10px 12px;
                color: #42557a;
                margin-bottom: 14px;
            }
            .notice strong {
                display: block;
                margin-bottom: 3px;
            }
            .notice.lock {
                background: #f8fafc;
                border-style: dashed;
                border-color: #cbd5e1;
                color: #64748b;
            }
            .card {
                background: #fff;
                border: 1px solid var(--line);
                border-radius: 7px;
                margin-bottom: 12px;
                overflow: hidden;
            }
            .card-head {
                display: flex;
                justify-content: space-between;
                gap: 12px;
                align-items: center;
                padding: 12px 14px;
                border-bottom: 1px solid var(--line);
            }
            .card-head h2 {
                font-size: 13px;
                margin: 0;
            }
            .card-head p {
                font-size: 10px;
                color: var(--muted);
                margin: 3px 0 0;
            }
            .card-body {
                padding: 13px 14px;
            }
            .section-label {
                padding: 9px 12px;
                border-left: 3px solid var(--red);
                background: #fff8fa;
                margin: 18px 0 10px;
                font-weight: 800;
                color: #7a2537;
            }
            .field-grid {
                display: grid;
                grid-template-columns: repeat(3, minmax(0, 1fr));
                gap: 14px 22px;
            }
            .field label {
                display: block;
                color: #7a8391;
                font-size: 9px;
                margin-bottom: 3px;
            }
            .field strong {
                font-size: 11px;
            }
            .table-wrap {
                overflow: auto;
                border: 1px solid var(--line);
                border-radius: 6px;
            }
            table {
                width: 100%;
                border-collapse: collapse;
                min-width: 900px;
            }
            th {
                background: #f7f8fa;
                color: #4b5563;
                font-size: 9px;
                text-align: left;
                padding: 8px 9px;
                border-bottom: 1px solid var(--line);
                white-space: nowrap;
            }
            td {
                padding: 9px;
                border-bottom: 1px solid #edf0f3;
                vertical-align: top;
                font-size: 10px;
            }
            tbody tr:last-child td {
                border-bottom: 0;
            }
            .name {
                font-weight: 800;
            }
            .sub {
                font-size: 9px;
                color: var(--muted);
                margin-top: 2px;
            }
            .badge {
                display: inline-flex;
                padding: 3px 6px;
                border-radius: 999px;
                font-size: 9px;
                font-weight: 750;
                border: 1px solid var(--line);
                background: #f8fafc;
            }
            .badge.amber {
                color: var(--amber);
                background: var(--amberbg);
                border-color: #efd39e;
            }
            .badge.green {
                color: var(--green);
                background: var(--greenbg);
                border-color: #bde7d5;
            }
            .profile-only {
                border-left: 3px solid #7b61d1;
            }
            .profile-only .card-head {
                background: #fbfaff;
            }
            .profile-note {
                font-size: 9px;
                color: #6c63a8;
                font-weight: 700;
            }
            .kpi-grid {
                display: grid;
                grid-template-columns: repeat(3, minmax(0, 1fr));
                gap: 10px;
            }
            .kpi {
                border: 1px solid var(--line);
                border-radius: 6px;
                padding: 10px;
            }
            .kpi .label {
                color: var(--muted);
                font-size: 9px;
            }
            .kpi .value {
                font-size: 19px;
                font-weight: 900;
                margin: 2px 0;
            }
            .compare-grid {
                display: grid;
                grid-template-columns: 170px repeat(3, minmax(240px, 1fr));
                border: 1px solid var(--line);
                border-radius: 6px;
                overflow: auto;
            }
            .cc {
                padding: 9px;
                border-right: 1px solid var(--line);
                border-bottom: 1px solid var(--line);
                font-size: 10px;
            }
            .cc.label {
                background: #f7f8fa;
                font-weight: 800;
            }
            .cc.head {
                background: #fff7f9;
                font-weight: 800;
            }
            .cs {
                grid-column: 1/-1;
                background: #344054;
                color: #fff;
                font-weight: 800;
                padding: 8px 9px;
                font-size: 10px;
            }
            .print-sheet {
                max-width: 980px;
                margin: 24px auto;
                background: #fff;
                padding: 26px 30px;
                border: 1px solid var(--line);
            }
            .print-sheet h1 {
                font-size: 18px;
                margin: 0 0 6px;
            }
            .print-sheet h2 {
                font-size: 12px;
                margin: 18px 0 8px;
            }
            .print-meta {
                display: grid;
                grid-template-columns: repeat(3, 1fr);
                gap: 8px 20px;
                margin: 14px 0;
            }
            .print-meta div {
                font-size: 10px;
            }
            .print-meta b {
                display: block;
                color: #667085;
                font-size: 9px;
                margin-bottom: 2px;
            }
            @media print {
                .proto,
                .topline,
                .header {
                    display: none !important;
                }
                .print-sheet {
                    border: 0;
                    margin: 0;
                    max-width: none;
                    padding: 0;
                }
                .btn {
                    display: none !important;
                }
            }

            .match-alert {
                display: flex;
                gap: 10px;
                align-items: flex-start;
                border: 1px solid #ef4444;
                background: #fff7f7;
                color: #7f1d1d;
                padding: 12px 14px;
                border-radius: 6px;
                margin-top: 12px;
            }
            .match-alert .icon {
                flex: 0 0 auto;
                width: 22px;
                height: 22px;
                border-radius: 50%;
                background: #ef4444;
                color: #fff;
                display: grid;
                place-items: center;
                font-weight: 900;
            }
            .match-alert ul {
                margin: 0;
                padding-left: 18px;
            }
            .profile-table td,
            .profile-table th {
                vertical-align: top;
            }
            .profile-table .address {
                color: var(--muted);
                font-size: 9px;
                margin-top: 2px;
                line-height: 1.35;
            }

            .compare-grid.five {
                grid-template-columns: 170px repeat(5, minmax(220px, 1fr));
            }
            .compare-list {
                display: grid;
                gap: 7px;
            }
            .compare-item {
                border: 1px solid var(--line);
                border-radius: 6px;
                padding: 8px;
                background: #fff;
            }
            .compare-item strong {
                display: block;
                font-size: 10px;
            }
            .compare-item span {
                display: block;
                color: var(--muted);
                font-size: 9px;
                margin-top: 2px;
            }
            .compare-hidden.hidden {
                display: none;
            }
            .expand-btn {
                margin-top: 8px;
            }

            .selection-bar {
                display: flex;
                justify-content: space-between;
                align-items: center;
                gap: 12px;
                padding: 10px 12px;
                margin: 12px 0;
                border: 1px solid #c8d7f8;
                border-radius: 7px;
                background: #eef4ff;
            }
            .selection-bar .left {
                display: flex;
                align-items: center;
                gap: 10px;
                flex-wrap: wrap;
            }
            .selection-count {
                font-weight: 800;
                color: #344054;
            }
            .compare-checkbox {
                width: 16px;
                height: 16px;
                cursor: pointer;
            }
            .compare-checkbox:disabled {
                cursor: not-allowed;
            }
            @media (max-width: 800px) {
                .field-grid,
                .kpi-grid {
                    grid-template-columns: 1fr;
                }
                .mainnav {
                    display: none;
                }
                .shell {
                    padding: 18px 12px 50px;
                }
                .title-row {
                    flex-direction: column;
                }
                .proto {
                    position: static;
                    flex-direction: column;
                    align-items: flex-start;
                }
            }
        </style>
    </head>

            function comparePage() {
                headerTitle("Pokja Pemilihan", "Bandingkan Profiling Penyedia");

                const row = (label, vals) =>
                    `<div class="cc label">${label}</div>${vals.map((v) => `<div class="cc">${v}</div>`).join("")}`;

                const listBlock = (items, formatter, groupKey) => {
                    const visible = items.slice(0, 3);
                    const extra = items.slice(3);
                    return `<div class="compare-list">
     ${visible.map((x) => `<div class="compare-item">${formatter(x)}</div>`).join("")}
     ${extra.map((x) => `<div class="compare-item compare-hidden hidden ${groupKey}-extra">${formatter(x)}</div>`).join("")}
   </div>`;
                };

                const experienceFor = (idx) => {
                    const rows = completed.slice(0, Math.min(completed.length, 4 + (idx % 3)));
                    return listBlock(
                        rows,
                        (x) =>
                            `<strong>${x[0]}</strong><span>${x[2]}</span><span>Serah Terima ${x[4]} · ${x[5]}</span>`,
                        "exp"
                    );
                };

                const runningFor = (idx) => {
                    const rows = runningAll.slice(0, Math.min(runningAll.length, 4 + ((idx + 1) % 3)));
                    return listBlock(
                        rows,
                        (x) => `<strong>${x[0]}</strong><span>${x[2]}</span><span>${x[5]} · ${x[7]}</span>`,
                        "run"
                    );
                };

                const potentialFor = (idx) => {
                    const rows = potentialContracts.slice(0, Math.min(potentialContracts.length, 4 + (idx % 4)));
                    return listBlock(
                        rows,
                        (x) =>
                            `<strong>${x[0]}</strong><span>${x[2]}</span><span>${x[5]} · ${x[7]}</span><span>ID ${x[6]}</span>`,
                        "pot"
                    );
                };

                const blacklistFor = (idx) => {
                    if (idx === 2) return `<span class="sub">Data belum tersedia</span>`;
                    const rows = idx === 1 ? [] : blacklistHistory.slice(0, idx === 0 ? 4 : 3);
                    if (!rows.length) return `<span class="sub">Tidak ditemukan record</span>`;
                    return listBlock(
                        rows,
                        (x) =>
                            `<strong>${x[0]} · ${x[5]}</strong><span>${x[1]}</span><span>${x[3]} – ${x[4]}</span><span>${x[2]}</span>`,
                        "bl"
                    );
                };

                const boFor = (idx) => {
                    const rows = boHistory.filter((x, i) => i % 5 === idx || idx === 0).slice(0, idx === 0 ? 4 : 3);
                    if (!rows.length) return `<span class="sub">Tidak ditemukan kesamaan</span>`;
                    return listBlock(
                        rows,
                        (x) => `<strong>${x[0]}</strong><span>${x[2]} ↔ ${x[3]}</span><span>${x[4]} · ${x[5]}</span>`,
                        "bo"
                    );
                };

                const sectionHeader = (title, key) => {
                    return `<div class="cs" style="display:flex;justify-content:space-between;align-items:center;gap:12px">
      <span>${title}</span>
      <button class="btn" onclick="toggleCompareSection('${key}',this)">Tampilkan semua</button>
   </div>`;

            function toggleCompareSection(key, button) {
                const items = document.querySelectorAll("." + key + "-extra");
                if (!items.length) {
                    button.style.display = "none";
                    return;
                }
                const opening = [...items].some((x) => x.classList.contains("hidden"));
                items.forEach((x) => x.classList.toggle("hidden", !opening));
                button.textContent = opening ? "Tutup data tambahan" : "Tampilkan semua";
            }

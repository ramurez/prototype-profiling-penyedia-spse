<!doctype html>
<html lang="id">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <title>Prototype Profiling Penyedia SPSE dan VMS</title>
        <style>
            :root {
                --red: #d92d50;
                --red-dark: #b42342;
                --navy: #344054;
                --ink: #1d2939;
                --muted: #667085;
                --line: #e4e7ec;
                --soft: #f6f7f9;
                --blue: #315fd4;
                --green: #087a53;
                --green-bg: #ecfdf3;
                --amber: #b25e09;
                --amber-bg: #fff7e8;
                --danger: #b42318;
                --danger-bg: #fff1f0;
                --white: #fff;
                --shadow: 0 1px 3px rgba(16, 24, 40, 0.08);
                --radius: 9px;
            }
            * {
                box-sizing: border-box;
            }
            html {
                scroll-behavior: smooth;
            }
            body {
                margin: 0;
                font:
                    14px/1.45 Inter,
                    ui-sans-serif,
                    -apple-system,
                    BlinkMacSystemFont,
                    "Segoe UI",
                    sans-serif;
                color: var(--ink);
                background: #f7f8fa;
            }
            button,
            input,
            select {
                font: inherit;
            }
            button,
            a {
                cursor: pointer;
            }
            a {
                text-decoration: none;
                color: inherit;
            }
            .hidden {
                display: none !important;
            }
            .prototype-bar {
                min-height: 38px;
                padding: 7px 22px;
                display: flex;
                gap: 12px;
                align-items: center;
                justify-content: space-between;
                background: #fff5cc;
                border-bottom: 1px solid #ecd66c;
                color: #684f00;
                font-size: 12px;
                position: sticky;
                top: 0;
                z-index: 50;
            }
            .prototype-nav {
                display: flex;
                gap: 6px;
                flex-wrap: wrap;
            }
            .proto-btn {
                border: 1px solid #d6bb55;
                background: #fffdf4;
                border-radius: 6px;
                padding: 5px 9px;
                font-weight: 700;
                color: #684f00;
            }
            .proto-btn.active {
                background: #684f00;
                color: #fff;
                border-color: #684f00;
            }
            .spse-header {
                height: 74px;
                background: #fff;
                border-bottom: 1px solid var(--line);
                display: flex;
                align-items: center;
                justify-content: space-between;
                padding: 0 34px;
            }
            .header-left,
            .brand,
            .user {
                display: flex;
                align-items: center;
            }
            .header-left {
                gap: 40px;
            }
            .brand {
                gap: 10px;
            }
            .logo-box {
                width: 39px;
                height: 39px;
                border-radius: 10px;
                background: var(--red);
                color: #fff;
                display: grid;
                place-items: center;
                font-size: 22px;
                font-weight: 900;
            }
            .brand-title {
                font-size: 20px;
                line-height: 1;
                font-weight: 900;
                letter-spacing: -0.4px;
            }
            .brand-title span {
                color: var(--red);
            }
            .brand-sub {
                font-size: 11px;
                color: #8b94a3;
                font-weight: 650;
                margin-top: 3px;
            }
            .spse-nav {
                display: flex;
                gap: 34px;
                height: 74px;
                align-items: center;
            }
            .spse-nav a {
                height: 74px;
                display: flex;
                align-items: center;
                font-weight: 700;
                color: #475467;
                border-bottom: 4px solid transparent;
            }
            .spse-nav a.active {
                color: var(--red);
                border-color: var(--red);
            }
            .user {
                gap: 10px;
            }
            .avatar {
                width: 38px;
                height: 38px;
                border-radius: 50%;
                background: #e5e7eb;
                display: grid;
                place-items: center;
                font-weight: 800;
            }
            .user strong,
            .user small {
                display: block;
            }
            .user small {
                font-size: 11px;
                color: var(--muted);
            }
            .spse-shell {
                max-width: 1440px;
                margin: auto;
                padding: 22px 34px 64px;
            }
            .breadcrumb {
                font-size: 12px;
                color: var(--blue);
                margin: 4px 0 20px;
            }
            .breadcrumb span {
                color: #98a2b3;
                margin: 0 7px;
            }
            .page-title-row {
                display: flex;
                justify-content: space-between;
                gap: 20px;
                align-items: flex-start;
                margin-bottom: 18px;
            }
            .page-title-row h1 {
                margin: 0 0 5px;
                font-size: 25px;
            }
            .page-title-row p {
                margin: 0;
                color: var(--muted);
            }
            .card {
                background: #fff;
                border: 1px solid var(--line);
                border-radius: var(--radius);
                box-shadow: var(--shadow);
                margin-bottom: 16px;
            }
            .card-head {
                padding: 16px 18px;
                border-bottom: 1px solid var(--line);
                display: flex;
                justify-content: space-between;
                gap: 16px;
                align-items: center;
            }
            .card-head h2 {
                font-size: 17px;
                margin: 0;
            }
            .card-head p {
                margin: 3px 0 0;
                color: var(--muted);
                font-size: 12px;
            }
            .card-body {
                padding: 18px;
            }
            .btn {
                display: inline-flex;
                align-items: center;
                justify-content: center;
                gap: 7px;
                border: 1px solid #d0d5dd;
                background: #fff;
                color: #344054;
                border-radius: 7px;
                padding: 9px 13px;
                font-weight: 750;
                font-size: 12px;
            }
            .btn:hover {
                background: #f9fafb;
            }
            .btn.primary {
                background: var(--red);
                border-color: var(--red);
                color: #fff;
            }
            .btn.primary:hover {
                background: var(--red-dark);
            }
            .btn.link {
                border-color: transparent;
                color: var(--blue);
                padding-left: 4px;
                padding-right: 4px;
            }
            .btn.small {
                padding: 6px 9px;
                font-size: 11px;
            }
            .btn:disabled {
                opacity: 0.45;
                cursor: not-allowed;
            }
            .actions {
                display: flex;
                gap: 8px;
                flex-wrap: wrap;
            }
            .badge {
                display: inline-flex;
                padding: 4px 8px;
                border-radius: 999px;
                font-size: 11px;
                font-weight: 750;
                border: 1px solid var(--line);
                background: #f9fafb;
            }
            .badge.green {
                color: var(--green);
                background: var(--green-bg);
                border-color: #b7e5d2;
            }
            .badge.amber {
                color: var(--amber);
                background: var(--amber-bg);
                border-color: #f0d39e;
            }
            .badge.red {
                color: var(--danger);
                background: var(--danger-bg);
                border-color: #f4b5ae;
            }
            .meta {
                font-size: 11px;
                color: var(--muted);
            }
            .tabs {
                display: flex;
                gap: 2px;
                border-bottom: 1px solid var(--line);
                overflow: auto;
            }
            .tab {
                padding: 12px 15px;
                font-weight: 750;
                color: #667085;
                border-bottom: 3px solid transparent;
                white-space: nowrap;
            }
            .tab.active {
                color: var(--red);
                border-color: var(--red);
            }
            .selection-bar {
                display: flex;
                justify-content: space-between;
                align-items: center;
                gap: 14px;
                flex-wrap: wrap;
                background: #f1f5ff;
                border: 1px solid #c9d6f7;
                border-radius: 8px;
                padding: 11px 13px;
                margin-bottom: 12px;
            }
            .selection-bar strong,
            .selection-bar small {
                display: block;
            }
            .selection-bar small {
                color: var(--muted);
            }
            .table-wrap {
                overflow: auto;
                border: 1px solid var(--line);
                border-radius: 8px;
            }
            table {
                width: 100%;
                border-collapse: collapse;
                min-width: 900px;
            }
            th {
                padding: 11px 12px;
                text-align: left;
                background: #f1f3f6;
                color: #344054;
                font-size: 11px;
                font-weight: 800;
                border-bottom: 1px solid var(--line);
                white-space: nowrap;
            }
            td {
                padding: 12px;
                border-bottom: 1px solid #eaecf0;
                vertical-align: top;
                font-size: 12px;
            }
            tbody tr:last-child td {
                border-bottom: 0;
            }
            tbody tr:nth-child(even) td {
                background: #fafbfc;
            }
            .name {
                font-weight: 800;
            }
            .sub {
                font-size: 10px;
                color: var(--muted);
                margin-top: 3px;
            }
            .amount {
                white-space: nowrap;
            }
            .check {
                width: 16px;
                height: 16px;
                accent-color: var(--red);
            }
            .empty,
            .error,
            .notice {
                padding: 16px;
                border-radius: 8px;
                font-size: 12px;
            }
            .empty {
                background: #f8fafc;
                border: 1px dashed #cbd5e1;
                text-align: center;
                color: #64748b;
            }
            .error {
                background: var(--danger-bg);
                border: 1px solid #f2b8b5;
                color: #8f1d16;
            }
            .notice {
                background: #eef4ff;
                border: 1px solid #c8d7f8;
                color: #344e7a;
            }
            .notice strong,
            .error strong {
                display: block;
                margin-bottom: 3px;
            }
            .profile-name {
                padding: 19px 20px;
                display: flex;
                justify-content: space-between;
                gap: 16px;
                align-items: center;
            }
            .profile-name h1 {
                font-size: 24px;
                margin: 2px 0 4px;
            }
            .source-grid {
                display: grid;
                grid-template-columns: repeat(4, minmax(0, 1fr));
                gap: 12px;
            }
            .source-card {
                border: 1px solid var(--line);
                border-radius: 8px;
                padding: 15px;
                background: #fff;
                display: flex;
                flex-direction: column;
                min-height: 152px;
            }
            .source-card .icon {
                width: 34px;
                height: 34px;
                border-radius: 8px;
                background: #fff0f3;
                color: var(--red);
                display: grid;
                place-items: center;
                font-weight: 900;
                margin-bottom: 11px;
            }
            .source-card h3 {
                font-size: 14px;
                margin: 0 0 5px;
            }
            .source-card p {
                font-size: 11px;
                color: var(--muted);
                margin: 0 0 13px;
                flex: 1;
            }
            .section-nav {
                display: flex;
                gap: 5px;
                overflow: auto;
                padding: 9px;
                background: #fff;
                border: 1px solid var(--line);
                border-radius: 8px;
                margin-bottom: 16px;
                position: sticky;
                top: 48px;
                z-index: 20;
            }
            .section-nav a {
                padding: 7px 10px;
                border-radius: 6px;
                font-size: 12px;
                font-weight: 750;
                color: #475467;
                white-space: nowrap;
            }
            .section-nav a:hover {
                background: #f2f4f7;
            }
            .disclaimer {
                font-size: 11px;
                color: #667085;
                margin-top: 8px;
            }
            .field-grid {
                display: grid;
                grid-template-columns: repeat(4, minmax(0, 1fr));
                gap: 17px;
            }
            .field label {
                display: block;
                color: #667085;
                font-size: 10px;
                margin-bottom: 3px;
            }
            .field strong {
                font-size: 13px;
            }
            .bo-alert {
                background: #fff8e8;
                border: 1px solid #f2d493;
                border-radius: 8px;
                padding: 12px 14px;
                margin-bottom: 12px;
                color: #70460b;
            }
            .bo-alert strong {
                display: block;
            }
            .bo-alert small {
                color: #8a641e;
            }
            .inline-tools {
                display: flex;
                gap: 9px;
                align-items: center;
                flex-wrap: wrap;
            }
            .input,
            .select {
                border: 1px solid #d0d5dd;
                border-radius: 7px;
                padding: 9px 11px;
                background: #fff;
                color: #344054;
            }
            .input {
                min-width: 240px;
            }
            .pagination {
                display: flex;
                justify-content: space-between;
                gap: 12px;
                align-items: center;
                margin-top: 11px;
                color: var(--muted);
                font-size: 11px;
            }
            .compare-grid {
                display: grid;
                grid-template-columns: 190px repeat(3, minmax(245px, 1fr));
                overflow: auto;
                border: 1px solid var(--line);
                border-radius: 8px;
            }
            .compare-cell {
                padding: 12px;
                border-right: 1px solid var(--line);
                border-bottom: 1px solid var(--line);
                font-size: 11px;
                min-width: 0;
            }
            .compare-cell:nth-child(4n) {
                border-right: 0;
            }
            .compare-label {
                background: #f5f6f8;
                font-weight: 800;
            }
            .compare-provider {
                background: #fff5f7;
            }
            .compare-provider strong {
                font-size: 13px;
                display: block;
            }
            .compare-section {
                grid-column: 1/-1;
                padding: 10px 12px;
                background: #344054;
                color: #fff;
                font-size: 12px;
                font-weight: 800;
            }
            .experience-list {
                display: grid;
                gap: 7px;
            }
            .experience-item {
                border: 1px solid var(--line);
                border-radius: 6px;
                padding: 8px;
                background: #fff;
            }
            .experience-item strong {
                display: block;
                font-size: 11px;
            }
            .experience-item span {
                display: block;
                color: var(--muted);
                font-size: 10px;
                margin-top: 3px;
            }
            .more-exp.hidden {
                display: none;
            }
            .compare-toolbar {
                display: flex;
                justify-content: space-between;
                align-items: center;
                gap: 12px;
                flex-wrap: wrap;
                margin-bottom: 12px;
            }
            .vms-header {
                height: 93px;
                background: #fff;
                border-bottom: 1px solid #e7e9ee;
                display: flex;
                align-items: center;
                justify-content: space-between;
                padding: 0 42px;
            }
            .vms-brand .brand-title {
                font-size: 26px;
            }
            .vms-brand .brand-sub {
                font-size: 13px;
            }
            .vms-user {
                display: flex;
                gap: 18px;
                align-items: center;
            }
            .vms-user .avatar {
                width: 50px;
                height: 50px;
            }
            .vms-app {
                display: grid;
                grid-template-columns: 370px minmax(0, 1fr);
                gap: 34px;
                padding: 32px 30px 60px;
                max-width: 1900px;
                margin: auto;
            }
            .vms-sidebar {
                background: #fff;
                border: 1px solid var(--line);
                border-radius: 9px;
                min-height: 760px;
                padding: 25px 0;
            }
            .side-title,
            .side-item {
                padding: 14px 34px;
            }
            .side-title {
                font-size: 17px;
                font-weight: 800;
                display: flex;
                justify-content: space-between;
            }
            .side-item {
                color: #7b8494;
                font-size: 16px;
            }
            .side-item.group {
                font-weight: 750;
                color: #344054;
            }
            .side-item.active {
                border-left: 4px solid var(--red);
                padding-left: 30px;
                color: var(--red);
                font-weight: 800;
                background: #fffafb;
            }
            .vms-main h1 {
                font-size: 30px;
                margin: 0 0 34px;
            }
            .vms-tabs {
                display: flex;
                gap: 0;
                border-bottom: 1px solid var(--line);
                overflow: auto;
                margin-bottom: 25px;
            }
            .vms-tab {
                padding: 14px 18px;
                color: #858e9d;
                font-size: 16px;
                white-space: nowrap;
                border-bottom: 4px solid transparent;
            }
            .vms-tab.active {
                color: #344054;
                font-weight: 800;
                border-color: var(--red);
            }
            .readonly {
                display: inline-flex;
                align-items: center;
                gap: 6px;
                padding: 7px 10px;
                border-radius: 6px;
                background: #f2f4f7;
                color: #475467;
                font-size: 11px;
                font-weight: 750;
            }
            .vms-tools {
                display: flex;
                justify-content: space-between;
                gap: 12px;
                align-items: center;
                flex-wrap: wrap;
                margin-bottom: 24px;
            }
            .vms-tools .left {
                display: flex;
                gap: 12px;
                flex-wrap: wrap;
            }
            .vms-tools .input,
            .vms-tools .select {
                height: 46px;
                font-size: 13px;
                min-width: 250px;
            }
            .vms-card {
                background: #fff;
                border: 1px solid var(--line);
                border-radius: 9px;
                padding: 23px 0;
                box-shadow: var(--shadow);
            }
            .vms-card-title {
                font-size: 17px;
                font-weight: 800;
                padding: 0 28px 20px;
            }
            .vms-card .table-wrap {
                border-radius: 0;
                border-left: 0;
                border-right: 0;
            }
            .vms-card table {
                min-width: 1250px;
            }
            .vms-card th {
                font-size: 12px;
                padding: 13px 14px;
            }
            .vms-card td {
                font-size: 12px;
                padding: 14px;
            }
            .vms-card .pagination {
                padding: 0 26px;
            }
            .identity-section {
                padding: 0 27px 24px;
            }
            .identity-section + .identity-section {
                border-top: 1px solid var(--line);
                padding-top: 22px;
            }
            .identity-section h2 {
                font-size: 17px;
                margin: 0 0 17px;
            }
            .vms-info-grid {
                display: grid;
                grid-template-columns: repeat(3, minmax(0, 1fr));
                gap: 22px 34px;
            }
            .vms-field label {
                display: block;
                color: #7b8494;
                font-size: 11px;
                margin-bottom: 5px;
            }
            .vms-field strong {
                font-size: 13px;
            }
            .kbli-list {
                display: grid;
                gap: 8px;
            }
            .kbli-row {
                display: grid;
                grid-template-columns: 120px 1fr 140px;
                gap: 14px;
                padding: 11px 12px;
                border: 1px solid var(--line);
                border-radius: 7px;
                font-size: 12px;
            }
            .kbli-row strong {
                color: var(--red);
            }
            .rating-shell {
                max-width: 1100px;
                margin: 36px auto;
                padding: 0 24px;
            }
            .rating-card {
                background: #fff;
                border: 1px solid var(--line);
                border-radius: 10px;
                padding: 28px;
                box-shadow: var(--shadow);
            }
            .rating-card h1 {
                margin: 0 0 8px;
            }
            .rating-value {
                font-size: 48px;
                font-weight: 900;
                color: #315fd4;
                margin: 18px 0 5px;
            }
            .rating-note {
                padding: 11px 13px;
                background: #f2f4f7;
                border-radius: 7px;
                color: #667085;
                font-size: 12px;
            }
            @media (max-width: 1100px) {
                .source-grid {
                    grid-template-columns: repeat(2, 1fr);
                }
                .vms-app {
                    grid-template-columns: 1fr;
                }
                .vms-sidebar {
                    display: none;
                }
                .field-grid,
                .vms-info-grid {
                    grid-template-columns: repeat(2, 1fr);
                }
            }
            @media (max-width: 900px) {
                .vms-header {
                    padding: 0 18px;
                }
                .vms-user {
                    gap: 10px;
                }
                .vms-user > div:last-child {
                    display: none;
                }
                .vms-main h1 {
                    font-size: 26px;
                    margin-bottom: 22px;
                }
            }
            @media (max-width: 720px) {
                .prototype-bar {
                    position: static;
                    align-items: flex-start;
                    flex-direction: column;
                }
                .spse-header,
                .vms-header {
                    padding: 0 16px;
                }
                .spse-nav {
                    display: none;
                }
                .spse-shell {
                    padding: 18px 14px 50px;
                }
                .page-title-row,
                .profile-name {
                    flex-direction: column;
                }
                .source-grid,
                .field-grid,
                .vms-info-grid {
                    grid-template-columns: 1fr;
                }
                .vms-app {
                    display: block;
                    padding: 24px 14px;
                }
                .vms-header {
                    height: 76px;
                }
                .vms-user > span {
                    display: none;
                }
                .compare-grid {
                    grid-template-columns: 150px repeat(3, 240px);
                }
            }
        </style>
    </head>
    <body>
        <div class="prototype-bar">
            <div><strong>PROTOTYPE</strong> · Data simulasi · Profiling Penyedia SPSE + VMS</div>
            <div class="prototype-nav">
                <button class="proto-btn" data-go="pokja">Entry Pokja</button
                ><button class="proto-btn" data-go="ppk">Entry PPK</button
                ><button class="proto-btn" data-go="profile">Profiling</button
                ><button class="proto-btn" data-go="compare">Perbandingan</button
                ><button class="proto-btn" data-go="vms-identity">VMS Identitas</button
                ><button class="proto-btn" data-go="vms-experience">VMS Pengalaman</button
                ><button class="proto-btn" data-go="vms-running">VMS Berjalan</button>
            </div>
        </div>

        <main id="app"></main>

        <template id="spseHeader">
            <header class="spse-header">
                <div class="header-left">
                    <div class="brand">
                        <div class="logo-box">▦</div>
                        <div>
                            <div class="brand-title"><span>INA</span>PROC</div>
                            <div class="brand-sub">SPSE V5 BETA</div>
                        </div>
                    </div>
                    <nav class="spse-nav"><a class="active">Beranda</a><a>Daftar Paket</a></nav>
                </div>
                <div class="user">

                );
            }
            function vmsIdentity() {
                let s = suppliers[supplierId];
                vmsShell(
                    "vms-identity",
                    `<div class="vms-card"><div class="vms-card-title">${s.name}</div><section class="identity-section"><h2>Identitas Penyedia</h2><div class="vms-info-grid"><div class="vms-field"><label>Nama Penyedia</label><strong>${s.name}</strong></div><div class="vms-field"><label>NIB</label><strong>${s.nib}</strong></div><div class="vms-field"><label>NPWP</label><strong>${s.npwp}</strong></div><div class="vms-field"><label>Bentuk Usaha</label><strong>${s.form}</strong></div><div class="vms-field"><label>Sumber</label><strong>VMS / OSS</strong></div><div class="vms-field"><label>Terakhir Diperbarui</label><strong>29 Oktober 2026 · 08.42 WIB</strong></div></div></section><section class="identity-section"><h2>Kualifikasi Usaha</h2><div class="vms-info-grid"><div class="vms-field"><label>Kualifikasi</label><strong>${s.qualification}</strong></div><div class="vms-field"><label>Status Data</label><strong><span class="badge green">Tersedia</span></strong></div></div></section><section class="identity-section"><h2>Bidang Usaha / KBLI</h2><div class="kbli-list">${s.kbli
                        .map((x) => {
                            let [c, ...d] = x.split(" · ");
                            return `<div class="kbli-row"><strong>${c}</strong><span>${d.join(" · ")}</span><span>KBLI 2020</span></div>`;
                        })
                        .join("")}</div></section></div>`
                );
            }
            function expRows(records) {
                return records
                    .map(
                        (x, i) =>
                            `<tr><td>${i + 1}</td><td><div class="name">${x.name}</div></td><td>${x.id}</td><td>${x.klpd}</td><td>${x.qual}</td><td class="amount">${x.value}</td><td>${x.start}</td><td>${x.end}</td><td><span class="badge ${x.status === "Selesai" ? "green" : x.status === "Sedang Berjalan" ? "amber" : ""}">${x.status}</span></td><td>${x.source}</td></tr>`
                    )
                    .join("");
            }
            function expTable(records) {
                return `<div class="table-wrap"><table><thead><tr><th>No</th><th>Nama Kontrak / Tender</th><th>ID Paket / No. Kontrak</th><th>K/L/PD</th><th>Kualifikasi</th><th>Nilai Kontrak</th><th>Tanggal Mulai</th><th>Tanggal Selesai</th><th>Status Paket Tender</th><th>Sumber</th></tr></thead><tbody id="expBody">${expRows(records)}</tbody></table></div><div class="pagination"><span>Menampilkan ${records.length} dari ${records.length} data</span><div class="actions"><button class="btn small">‹</button><button class="btn small primary">1</button><button class="btn small">›</button></div></div>`;
            }
            function vmsExperience() {
                let records = experiences.filter((x) => x.status !== "Berpotensi Berkontrak");
                vmsShell(
                    "vms-experience",
                    `<div class="vms-tools"><div class="left"><input id="expSearch" class="input" placeholder="Cari nama atau nomor kontrak"><select id="statusFilter" class="select"><option>Semua Status</option><option selected>Selesai</option><option>Sedang Berjalan</option></select><select class="select"><option>10 Tahun Terakhir</option><option>Semua Periode</option></select><button id="resetFilter" class="btn">Reset</button></div></div><div class="vms-card"><div class="vms-card-title">Daftar Pengalaman</div><div id="expTable">${expTable(records.filter((x) => x.status === "Selesai"))}</div></div>`
                );
                let search = document.querySelector("#expSearch"),
                    filter = document.querySelector("#statusFilter");
                let run = () => {
                    let q = search.value.toLowerCase(),
                        st = filter.value;
                    let r = records.filter(
                        (x) =>
                            (st === "Semua Status" || x.status === st) && `${x.name} ${x.id}`.toLowerCase().includes(q)
                    );
                    document.querySelector("#expTable").innerHTML = r.length
                        ? expTable(r)
                        : emptyState("Tidak ada pengalaman yang sesuai dengan filter.");
                };
                search.oninput = run;
                filter.onchange = run;
                document.querySelector("#resetFilter").onclick = () => {
                    search.value = "";
                    filter.value = "Semua Status";
                    run();
                };
            }
            function vmsRunning() {
                let records = experiences.filter((x) => x.status === "Sedang Berjalan");
                vmsShell(
                    "vms-running",
                    `<div class="notice" style="margin-bottom:18px"><strong>Dasar klasifikasi</strong>Daftar ini menggunakan status paket tender yang dipetakan ke <b>SEDANG_BERJALAN</b>, bukan berdasarkan tanggal selesai.</div><div class="vms-tools"><div class="left"><input class="input" placeholder="Cari nama atau nomor kontrak"><select class="select"><option>Status: Sedang Berjalan</option></select></div></div><div class="vms-card"><div class="vms-card-title">Daftar Pengalaman Berjalan</div>${expTable(records)}</div>`
                );
            }
            function rating() {
                app.innerHTML = "";
                app.append(clone("spseHeader"));
                app.insertAdjacentHTML(
                    "beforeend",
                    `<div class="rating-shell"><div class="breadcrumb">Sistem Penilaian Kinerja <span>›</span> Rata-rata Penilaian Penyedia</div><div class="rating-card"><div class="meta">HALAMAN SUMBER · DATA SIMULASI</div><h1>Rata-rata Penilaian Kinerja</h1><p>${suppliers[supplierId].name} · Periode empat tahun sesuai ketentuan sistem sumber</p><div class="rating-value">88,6</div><div class="meta">Skala 0–100 · 12 record penilaian</div><div class="rating-note" style="margin-top:20px">Perhitungan, periode, dan nilai dikelola oleh sistem sumber. Profiling Penyedia hanya menyediakan akses menuju halaman ini.</div></div></div>`
                );
            }
            function render() {
                current = current || "pokja";
                if (current === "pokja") entryPokja();
                else if (current === "ppk") entryPpk();
                else if (current === "profile") profile();
                else if (current === "compare") compare();
                else if (current === "vms-identity") vmsIdentity();
                else if (current === "vms-experience") vmsExperience();
                else if (current === "vms-running") vmsRunning();
                else if (current === "rating") rating();
                else {
                    current = "pokja";
                    entryPokja();
                }
                activeProto();
            }
            function go(view) {
                current = view;
                history.pushState({}, "", `?view=${view}&supplier=${supplierId}`);
                render();
            }
            window.go = go;
            document.querySelectorAll(".proto-btn").forEach((b) => (b.onclick = () => go(b.dataset.go)));
            window.onpopstate = () => {
                let p = new URLSearchParams(location.search);
                current = p.get("view") || "pokja";
                supplierId = p.get("supplier") || "p1";
                render();
            };
            render();
        </script>
    </body>
</html>

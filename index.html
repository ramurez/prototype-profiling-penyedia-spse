<!doctype html>
<html lang="id">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <title>Prototype Dokumen Kualifikasi + Profiling Penyedia</title>
        <style>
            :root {
                --red: #e12b4b;
                --ink: #1f2937;
                --muted: #667085;
                --line: #e6e8ec;
                --blue: #315fd4;
                --amber: #a15c08;
                --amberbg: #fff7e8;
                --green: #0a7a55;
                --greenbg: #ecfdf3;
            }
            * {
                box-sizing: border-box;
            }
            body {
                margin: 0;
                font:
                    12px/1.45 Inter,
                    ui-sans-serif,
                    -apple-system,
                    BlinkMacSystemFont,
                    "Segoe UI",
                    sans-serif;
                color: var(--ink);
                background: #f6f7f9;
            }
            button {
                font: inherit;
                cursor: pointer;
            }
            .hidden {
                display: none !important;
            }
            .proto {
                position: sticky;
                top: 0;
                z-index: 99;
                background: #fff7cc;
                border-bottom: 1px solid #ead36d;
                padding: 7px 16px;
                display: flex;
                justify-content: space-between;
                gap: 12px;
                align-items: center;
                color: #6b5600;
                font-size: 11px;
            }
            .proto .nav {
                display: flex;
                gap: 6px;
                flex-wrap: wrap;
            }
            .pbtn {
                border: 1px solid #d8bf54;
                background: #fffdf5;
                border-radius: 6px;
                padding: 5px 8px;
                font-weight: 700;
                color: #6b5600;
            }
            .pbtn.active {
                background: #6b5600;
                color: #fff;
            }
            .topline {
                height: 28px;
                background: #f1f3f6;
                border-bottom: 1px solid #e5e7eb;
            }
            .inner,
            .shell {
                max-width: 1280px;
                margin: auto;
            }
            .topline .inner {
                height: 28px;
                display: flex;
                justify-content: space-between;
                align-items: center;
                padding: 0 22px;
                color: #737b88;
                font-size: 10px;
            }
            .header {
                height: 72px;
                background: #fff;
                border-bottom: 1px solid var(--line);
            }
            .header .inner {
                height: 100%;
                display: flex;
                justify-content: space-between;
                align-items: center;
                padding: 0 22px;
            }
            .brand {
                display: flex;
                gap: 10px;
                align-items: center;
            }
            .logo {
                width: 28px;
                height: 28px;
                border-radius: 50%;
                background: var(--red);
                color: #fff;
                display: grid;
                place-items: center;
                font-weight: 900;
            }
            .brand b {
                font-size: 15px;
            }
            .brand span {
                color: var(--red);
            }
            .header-left {
                display: flex;
                align-items: center;
            }
            .mainnav {
                display: flex;
                gap: 24px;
                margin-left: 34px;
            }
            .mainnav a {
                height: 72px;
                display: flex;
                align-items: center;
                font-weight: 700;
                color: #505968;
                border-bottom: 3px solid transparent;
            }
            .mainnav a.active {
                border-color: var(--red);
                color: #111827;
            }
            .user {
                display: flex;
                align-items: center;
                gap: 9px;
            }
            .avatar {
                width: 32px;
                height: 32px;
                border-radius: 50%;
                background: #e8eaee;
                display: grid;
                place-items: center;
                font-weight: 800;
            }
            .user small {
                display: block;
                color: #8a93a2;
                font-size: 9px;
            }
            .shell {
                padding: 24px 22px 60px;
            }
            .breadcrumb {
                color: #4d67c9;
                font-size: 10px;
                margin-bottom: 14px;
            }
            .title-row {
                display: flex;
                justify-content: space-between;
                gap: 16px;
                align-items: flex-start;
                margin-bottom: 14px;
            }
            .title-row h1 {
                font-size: 18px;
                margin: 0 0 3px;
            }
            .title-row p {
                margin: 0;
                color: var(--muted);
            }
            .actions {
                display: flex;
                gap: 8px;
                align-items: center;
                flex-wrap: wrap;
            }
            .btn {
                display: inline-flex;
                align-items: center;
                justify-content: center;
                padding: 7px 10px;
                border: 1px solid #d0d5dd;
                background: #fff;
                border-radius: 6px;
                color: #344054;
                font-weight: 700;
                font-size: 10px;
            }
            .btn.primary {
                background: var(--red);
                border-color: var(--red);
                color: #fff;
            }
            .notice {
                background: #f4f7ff;
                border: 1px solid #cad6f8;
                border-radius: 7px;
                padding: 10px 12px;
                color: #42557a;
                margin-bottom: 14px;
            }
            .notice strong {
                display: block;
                margin-bottom: 3px;
            }
            .notice.lock {
                background: #f8fafc;
                border-style: dashed;
                border-color: #cbd5e1;
                color: #64748b;
            }
            .card {
                background: #fff;
                border: 1px solid var(--line);
                border-radius: 7px;
                margin-bottom: 12px;
                overflow: hidden;
            }
            .card-head {
                display: flex;
                justify-content: space-between;
                gap: 12px;
                align-items: center;
                padding: 12px 14px;
                border-bottom: 1px solid var(--line);
            }
            .card-head h2 {
                font-size: 13px;
                margin: 0;
            }
            .card-head p {
                font-size: 10px;
                color: var(--muted);
                margin: 3px 0 0;
            }
            .card-body {
                padding: 13px 14px;
            }
            .section-label {
                padding: 9px 12px;
                border-left: 3px solid var(--red);
                background: #fff8fa;
                margin: 18px 0 10px;
                font-weight: 800;
                color: #7a2537;
            }
            .field-grid {
                display: grid;
                grid-template-columns: repeat(3, minmax(0, 1fr));
                gap: 14px 22px;
            }
            .field label {
                display: block;
                color: #7a8391;
                font-size: 9px;
                margin-bottom: 3px;
            }
            .field strong {
                font-size: 11px;
            }
            .table-wrap {
                overflow: auto;
                border: 1px solid var(--line);
                border-radius: 6px;
            }
            table {
                width: 100%;
                border-collapse: collapse;
                min-width: 900px;
            }
            th {
                background: #f7f8fa;
                color: #4b5563;
                font-size: 9px;
                text-align: left;
                padding: 8px 9px;
                border-bottom: 1px solid var(--line);
                white-space: nowrap;
            }
            td {
                padding: 9px;
                border-bottom: 1px solid #edf0f3;
                vertical-align: top;
                font-size: 10px;
            }
            tbody tr:last-child td {
                border-bottom: 0;
            }
            .name {
                font-weight: 800;
            }
            .sub {
                font-size: 9px;
                color: var(--muted);
                margin-top: 2px;
            }
            .badge {
                display: inline-flex;
                padding: 3px 6px;
                border-radius: 999px;
                font-size: 9px;
                font-weight: 750;
                border: 1px solid var(--line);
                background: #f8fafc;
            }
            .badge.amber {
                color: var(--amber);
                background: var(--amberbg);
                border-color: #efd39e;
            }
            .badge.green {
                color: var(--green);
                background: var(--greenbg);
                border-color: #bde7d5;
            }
            .profile-only {
                border-left: 3px solid #7b61d1;
            }
            .profile-only .card-head {
                background: #fbfaff;
            }
            .profile-note {
                font-size: 9px;
                color: #6c63a8;
                font-weight: 700;
            }
            .summary-grid {
                display: grid;
                grid-template-columns: repeat(3, minmax(0, 1fr));
                gap: 10px;
            }
            .summary-box {
                border: 1px solid var(--line);
                border-radius: 7px;
                padding: 12px;
                background: #fff;
            }
            .summary-box .summary-label {
                font-size: 9px;
                color: var(--muted);
                margin-bottom: 4px;
            }
            .summary-box .summary-value {
                font-size: 18px;
                font-weight: 900;
                line-height: 1.2;
            }
            .summary-box .summary-desc {
                font-size: 9px;
                color: var(--muted);
                margin-top: 4px;
            }
            .profile-summary-row{
                display:grid;
                grid-template-columns:repeat(3,minmax(0,1fr));
                gap:10px;
            }
            .profile-summary-row.two{
                grid-template-columns:repeat(2,minmax(0,1fr));
            }
            .profile-direct{
                display:flex;
                align-items:center;
                justify-content:space-between;
                gap:12px;
                flex-wrap:wrap;
                padding:4px 0;
            }
            .profile-direct .text{
                min-width:0;
            }
            .profile-direct .text strong{
                display:block;
                margin-bottom:3px;
            }
            .profile-direct .text span{
                color:var(--muted);
                font-size:10px;
            }
            .profile-summary-card{
                border:1px solid var(--line);
                border-radius:7px;
                padding:12px;
                background:#fff;
            }
            .profile-summary-card .label{
                color:var(--muted);
                font-size:9px;
                margin-bottom:4px;
            }
            .profile-summary-card .value{
                font-size:17px;
                font-weight:900;
                line-height:1.25;
            }
            .profile-summary-card .desc{
                color:var(--muted);
                font-size:9px;
                margin-top:4px;
            }
            .profile-summary-card .status-active{
                color:#b42318;
            }
            .eval-table-note{
                background:#eef6ff;
                border:1px solid #84b8ff;
                border-left:4px solid #2f80ed;
                border-radius:4px;
                padding:12px 14px;
                margin-bottom:16px;
                color:#344054;
            }
            .legend{
                display:flex;
                gap:10px;
                flex-wrap:wrap;
                margin-top:10px;
                color:#475467;
                font-size:9px;
            }
            .legend b{
                display:inline-flex;
                width:18px;height:18px;
                border-radius:4px;
                align-items:center;justify-content:center;
                margin-right:4px;
                color:#fff;
                background:#344054;
            }

            .summary-action {
                margin-top: 12px;
                display: flex;
                justify-content: flex-end;
            }

            .kpi-grid {
                display: grid;
                grid-template-columns: repeat(3, minmax(0, 1fr));
                gap: 10px;
            }
            .kpi {
                border: 1px solid var(--line);
                border-radius: 6px;
                padding: 10px;
            }
            .kpi .label {
                color: var(--muted);
                font-size: 9px;
            }
            .kpi .value {
                font-size: 19px;
                font-weight: 900;
                margin: 2px 0;
            }
            .compare-grid {
                display: grid;
                grid-template-columns: 170px repeat(3, minmax(240px, 1fr));
                border: 1px solid var(--line);
                border-radius: 6px;
                overflow: auto;
            }
            .cc {
                padding: 9px;
                border-right: 1px solid var(--line);
                border-bottom: 1px solid var(--line);
                font-size: 10px;
            }
            .cc.label {
                background: #f7f8fa;
                font-weight: 800;
            }
            .cc.head {
                background: #fff7f9;
                font-weight: 800;
            }
            .cs {
                grid-column: 1/-1;
                background: #344054;
                color: #fff;
                font-weight: 800;
                padding: 8px 9px;
                font-size: 10px;
            }
            .print-sheet {
                max-width: 980px;
                margin: 24px auto;
                background: #fff;
                padding: 26px 30px;
                border: 1px solid var(--line);
            }
            .print-sheet h1 {
                font-size: 18px;
                margin: 0 0 6px;
            }
            .print-sheet h2 {
                font-size: 12px;
                margin: 18px 0 8px;
            }
            .print-meta {
                display: grid;
                grid-template-columns: repeat(3, 1fr);
                gap: 8px 20px;
                margin: 14px 0;
            }
            .print-meta div {
                font-size: 10px;
            }
            .print-meta b {
                display: block;
                color: #667085;
                font-size: 9px;
                margin-bottom: 2px;
            }
            @media print {
                .proto,
                .topline,
                .header {
                    display: none !important;
                }
                .print-sheet {
                    border: 0;
                    margin: 0;
                    max-width: none;
                    padding: 0;
                }
                .btn {
                    display: none !important;
                }
            }

            .match-alert {
                display: flex;
                gap: 10px;
                align-items: flex-start;
                border: 1px solid #ef4444;
                background: #fff7f7;
                color: #7f1d1d;
                padding: 12px 14px;
                border-radius: 6px;
                margin-top: 12px;
            }
            .match-alert .icon {
                flex: 0 0 auto;
                width: 22px;
                height: 22px;
                border-radius: 50%;
                background: #ef4444;
                color: #fff;
                display: grid;
                place-items: center;
                font-weight: 900;
            }
            .match-alert ul {
                margin: 0;
                padding-left: 18px;
            }
            .profile-table td,
            .profile-table th {
                vertical-align: top;
            }
            .profile-table .address {
                color: var(--muted);
                font-size: 9px;
                margin-top: 2px;
                line-height: 1.35;
            }

            .compare-grid.five {
                grid-template-columns: 170px repeat(5, minmax(220px, 1fr));
            }
            .compare-list {
                display: grid;
                gap: 7px;
            }
            .compare-item {
                border: 1px solid var(--line);
                border-radius: 6px;
                padding: 8px;
                background: #fff;
            }
            .compare-item strong {
                display: block;
                font-size: 10px;
            }
            .compare-item span {
                display: block;
                color: var(--muted);
                font-size: 9px;
                margin-top: 2px;
            }
            .compare-hidden.hidden {
                display: none;
            }
            .expand-btn {
                margin-top: 8px;
            }

            .selection-bar {
                display: flex;
                justify-content: space-between;
                align-items: center;
                gap: 12px;
                padding: 10px 12px;
                margin: 12px 0;
                border: 1px solid #c8d7f8;
                border-radius: 7px;
                background: #eef4ff;
            }
            .selection-bar .left {
                display: flex;
                align-items: center;
                gap: 10px;
                flex-wrap: wrap;
            }
            .selection-count {
                font-weight: 800;
                color: #344054;
            }
            .compare-checkbox {
                width: 16px;
                height: 16px;
                cursor: pointer;
            }
            .compare-checkbox:disabled {
                cursor: not-allowed;
            }
            @media (max-width: 800px) {
                .field-grid,
                .summary-grid {
                display: grid;
                grid-template-columns: repeat(3, minmax(0, 1fr));
                gap: 10px;
            }
            .summary-box {
                border: 1px solid var(--line);
                border-radius: 7px;
                padding: 12px;
                background: #fff;
            }
            .summary-box .summary-label {
                font-size: 9px;
                color: var(--muted);
                margin-bottom: 4px;
            }
            .summary-box .summary-value {
                font-size: 18px;
                font-weight: 900;
                line-height: 1.2;
            }
            .summary-box .summary-desc {
                font-size: 9px;
                color: var(--muted);
                margin-top: 4px;
            }
            .profile-summary-row{
                display:grid;
                grid-template-columns:repeat(3,minmax(0,1fr));

            }
            .profile-summary-row.two{
                grid-template-columns:repeat(2,minmax(0,1fr));
            }

            }

            }

                color:var(--muted);

            }

                color:var(--muted);

            }
            .profile-summary-card .status-active{
                color:#b42318;
            }

                align-items:center;justify-content:center;

                color:#fff;
                background:#344054;
            }

                margin-top: 12px;
                display: flex;
                justify-content: flex-end;
            }

            .kpi-grid {
                    grid-template-columns: 1fr;
                }
                .mainnav {
                    display: none;
                }
                .shell {
                    padding: 18px 12px 50px;
                }
                .title-row {
                    flex-direction: column;
                }
                .proto {
                    position: static;
                    flex-direction: column;
                    align-items: flex-start;
                }
            }

            .spse-page{
                max-width:1180px;
                margin:0 auto;
                padding:20px 18px 60px;
            }
            .spse-breadcrumb{
                color:#315fd4;
                font-size:12px;
                margin:10px 0 22px;
            }
            .spse-tabs{
                display:flex;
                gap:34px;
                border-bottom:1px solid #e5e7eb;
                margin-bottom:20px;
                padding:0 10px;
            }
            .spse-tab{
                padding:14px 0 12px;
                color:#7b8494;
                font-weight:700;
                font-size:12px;
                border-bottom:3px solid transparent;
            }
            .spse-tab.active{
                color:#202938;
                border-color:#e12b4b;
            }
            .spse-main-card{
                background:#fff;
                border:1px solid #e4e7ec;
                border-radius:8px;
                padding:14px;
            }
            .spse-title{
                font-size:17px;
                font-weight:800;
                margin:2px 0 14px;
            }
            .spse-info{
                background:#f0f7ff;
                border:1px solid #66a9ff;
                border-left:4px solid #2588ff;
                border-radius:4px;
                padding:12px 14px;
                margin-bottom:14px;
                display:flex;
                align-items:center;
                gap:10px;
                color:#3f4d63;
            }
            .spse-info .i{
                width:22px;height:22px;
                border-radius:50%;
                border:2px solid #2588ff;
                color:#2588ff;
                display:grid;place-items:center;
                font-weight:900;
                flex:0 0 auto;
            }
            .spse-meta{
                display:grid;
                grid-template-columns:220px 1fr;
                gap:8px 18px;
                padding:0 16px 14px;
                font-size:11px;
            }
            .spse-meta strong{font-weight:800}
            .spse-panel{
                border:1px solid #e3e6eb;
                border-radius:8px;
                overflow:hidden;
                margin-top:4px;
            }
            .spse-panel-title{
                background:#f5f6f8;
                padding:10px 14px;
                font-weight:800;
                font-size:11px;
            }
            .spse-table-wrap{padding:12px 14px 0;overflow:auto}
            .spse-eval-table{
                width:100%;
                border-collapse:collapse;
                min-width:900px;
                font-size:11px;
            }
            .spse-eval-table th{
                background:#f6f7f9;
                color:#465066;
                font-size:10px;
                padding:12px 10px;
                border-bottom:1px solid #e5e7eb;
            }
            .spse-eval-table td{
                padding:13px 10px;
                border-bottom:1px solid #edf0f3;
                vertical-align:middle;
            }
            .spse-name-link{
                background:none;
                border:0;
                padding:0;
                color:#315fd4;
                font-weight:700;
                cursor:pointer;
            }
            .spse-name-link:hover{text-decoration:underline}
            .spse-status{
                display:inline-flex;
                align-items:center;
                justify-content:center;
                width:18px;height:18px;
                border-radius:4px;
                font-weight:800;
                font-size:10px;
                color:#fff;
                background:#344054;
            }
            .spse-status.k{background:#f04438}
            .spse-status.h{background:#12b76a}
            .spse-status.b{background:#f04438}
            .spse-status.p{background:#f79009}
            .spse-check{
                color:#12b76a;
                font-weight:900;
                font-size:13px;
            }
            .spse-star{
                color:#f79009;
                font-size:15px;
            }
            .spse-legend{
                display:flex;
                flex-wrap:wrap;
                gap:7px 12px;
                padding:8px 14px 14px;
                font-size:10px;
                color:#475467;
            }
            .spse-compare{
                display:flex;
                align-items:center;
                justify-content:space-between;
                gap:10px;
                flex-wrap:wrap;
                padding:10px 14px;
                border-top:1px solid #edf0f3;
                background:#fbfcfd;
            }
            .spse-compare .hint{
                font-size:10px;
                color:#667085;
            }
            .spse-approval{
                margin-top:10px;
            }
            @media(max-width:800px){
                .spse-tabs{gap:18px;overflow:auto}
                .spse-meta{grid-template-columns:1fr}
                .spse-page{padding:14px 10px 40px}

 <h2>Profiling Penyedia — Pekerjaan Berpotensi Berkontrak</h2>${experienceTable(potentialContracts.slice(0, 10))}<p>Menampilkan maksimal 10 data pada halaman cetak.</p>
 <h2>Profiling Penyedia — Riwayat Daftar Hitam</h2><p>Detail tersedia pada Daftar Hitam INAPROC. Tautan cetak tidak memuat halaman eksternal.</p>
 <h2>Profiling Penyedia — Rata-rata Penilaian Kinerja 4 Tahun</h2><p>Detail tersedia pada halaman Riwayat Penilaian Penyedia. URL TBD.</p>
 <div class="actions" style="margin-top:18px"><button class="btn" onclick="window.print()">Print / Save PDF</button><button class="btn" onclick="go('pokja-eligible')">Kembali</button></div>
 </div>`;
            }
            function comparePage() {
                headerTitle("Pokja Pemilihan", "Bandingkan Profiling Penyedia");
                const ids = [0, 1, 2, 3, 4];

                const row = (label, vals) =>
                    `<div class="cc label">${label}</div>${vals.map((v) => `<div class="cc">${v}</div>`).join("")}`;

                const listBlock = (items, formatter, groupKey) => {
                    const visible = items.slice(0, 3);
                    const extra = items.slice(3);
                    return `<div class="compare-list">
     ${visible.map((x) => `<div class="compare-item">${formatter(x)}</div>`).join("")}
     ${extra.map((x) => `<div class="compare-item compare-hidden hidden ${groupKey}-extra">${formatter(x)}</div>`).join("")}
   </div>`;
                };

                const experienceFor = (idx) => {
                    const rows = completed.slice(0, Math.min(completed.length, 4 + (idx % 3)));
                    return listBlock(
                        rows,
                        (x) =>
                            `<strong>${x[0]}</strong><span>${x[2]}</span><span>Serah Terima ${x[4]} · ${x[5]}</span>`,
                        "exp"
                    );
                };

                const runningFor = (idx) => {
                    const rows = runningAll.slice(0, Math.min(runningAll.length, 4 + ((idx + 1) % 3)));
                    return listBlock(
                        rows,
                        (x) => `<strong>${x[0]}</strong><span>${x[2]}</span><span>${x[5]} · ${x[7]}</span>`,
                        "run"
                    );
                };

                const potentialFor = (idx) => {
                    const rows = potentialContracts.slice(0, Math.min(potentialContracts.length, 4 + (idx % 4)));
                    return listBlock(
                        rows,
                        (x) =>
                            `<strong>${x[0]}</strong><span>${x[2]}</span><span>${x[5]} · ${x[7]}</span><span>ID ${x[6]}</span>`,
                        "pot"
                    );
                };

                const blacklistFor = (idx) => {
                    if (idx === 2) return `<span class="sub">Data belum tersedia</span>`;
                    const rows = idx === 1 ? [] : blacklistHistory.slice(0, idx === 0 ? 4 : 3);
                    if (!rows.length) return `<span class="sub">Tidak ditemukan record</span>`;
                    return listBlock(
                        rows,
                        (x) =>
                            `<strong>${x[0]} · ${x[5]}</strong><span>${x[1]}</span><span>${x[3]} – ${x[4]}</span><span>${x[2]}</span>`,
                        "bl"
                    );
                };

                const boFor = (idx) => {
                    const rows = boHistory.filter((x, i) => i % 5 === idx || idx === 0).slice(0, idx === 0 ? 4 : 3);
                    if (!rows.length) return `<span class="sub">Tidak ditemukan kesamaan</span>`;
                    return listBlock(
                        rows,
                        (x) => `<strong>${x[0]}</strong><span>${x[2]} ↔ ${x[3]}</span><span>${x[4]} · ${x[5]}</span>`,
                        "bo"
                    );
                };

                const sectionHeader = (title, key) => {
                    return `<div class="cs" style="display:flex;justify-content:space-between;align-items:center;gap:12px">
      <span>${title}</span>
      <button class="btn" onclick="toggleCompareSection('${key}',this)">Tampilkan semua</button>
   </div>`;
                };

                return `<div class="shell">
   <div class="breadcrumb">Beranda › Informasi Tender › Bandingkan Profiling Penyedia</div>
   <div class="title-row">
     <div>
       <h1>Bandingkan Profiling Penyedia</h1>
       <p>Maksimal 5 penyedia dalam satu proses perbandingan. Semua informasi ditampilkan dalam satu halaman.</p>
     </div>
     <button class="btn" onclick="go('pokja-eligible')">Kembali ke Dokumen Kualifikasi</button>
   </div>

   <div class="notice">
     <strong>Informasi pendukung</strong>
     Perbandingan tidak memberikan skor risiko, ranking, rekomendasi, keputusan lulus/gugur, atau kesimpulan pelanggaran.
   </div>

   <section class="card">
     <div class="card-head"><div><h2>5 Penyedia Dipilih</h2><p>Batas maksimal perbandingan: 5 penyedia.</p></div></div>
     <div class="card-body">
       <div class="compare-grid five">
         <div class="cc label">Data</div>
         ${ids.map((i) => `<div class="cc head">${suppliers[i][0]}<div class="sub">${suppliers[i][1]}</div></div>`).join("")}

         <div class="cs">Identitas & Kualifikasi</div>
         ${row(
             "Kualifikasi",
             ids.map((i) => suppliers[i][1])
         )}
         ${row(
             "KBLI",
             ids.map((i) => suppliers[i][2])
         )}

         ${sectionHeader("Pengalaman Selesai 10 Tahun", "exp")}
         ${row(
             "Daftar Pengalaman",
             ids.map((i) => experienceFor(i))
         )}

         ${sectionHeader("Pekerjaan Berjalan (Semua)", "run")}
         ${row(
             "Daftar Pekerjaan",
             ids.map((i) => runningFor(i))
         )}

         ${sectionHeader("Pekerjaan Berpotensi Berkontrak", "pot")}
         ${row(
             "Daftar Paket",
             ids.map((i) => potentialFor(i))
         )}

         ${sectionHeader("Riwayat Daftar Hitam", "bl")}
         ${row(
             "Riwayat",
             ids.map((i) => blacklistFor(i))
         )}

         ${sectionHeader("Kesamaan Pemilik Manfaat", "bo")}
         ${row(
             "Riwayat Kesamaan",
             ids.map((i) => boFor(i))
         )}
       </div>
     </div>
   </section>
 </div>`;
            }

            function toggleCompareSection(key, button) {
                const items = document.querySelectorAll("." + key + "-extra");
                if (!items.length) {
                    button.style.display = "none";
                    return;
                }
                const opening = [...items].some((x) => x.classList.contains("hidden"));
                items.forEach((x) => x.classList.toggle("hidden", !opening));
                button.textContent = opening ? "Tutup data tambahan" : "Tampilkan semua";
            }
            window.toggleCompareSection = toggleCompareSection;

            function redirect(label) {
                alert("Simulasi redirect ke: " + label);
            }
            function redirectBlacklist() {
                alert("Simulasi redirect ke daftar-hitam.inaproc.id dengan filter nama: DANUREKSA SARANA CIPTA");
            }
            function render(view) {
                document.querySelectorAll(".pbtn").forEach((b) => b.classList.toggle("active", b.dataset.s === view));
                if (view === "compare") {
                    document.querySelector("#app").innerHTML = comparePage();
                    return;
                }
                if (view === "pokja-list") {
                    document.querySelector("#app").innerHTML = pokjaParticipantListPage();
                    return;
                }
                if (view === "entry2") {
                    document.querySelector("#app").innerHTML = entryPoint2();
                    return;
                }
                if (view === "ppk-entry") {
                    document.querySelector("#app").innerHTML = ppkEntryPage();
                    return;
                }
                if (view === "print") {
                    document.querySelector("#app").innerHTML = printPage();
                    return;
                }
                const cfg = {
                    "pokja-eligible": ["Pokja Pemilihan", "Pembukaan Dokumen Kualifikasi", true],
                    "pokja-before": ["Pokja Pemilihan", "Sebelum Pembukaan Dokumen Kualifikasi", false],
                    "ppk-eligible": ["PPK", "Penandatanganan Kontrak", true],
                    "ppk-before": ["PPK", "Sebelum Penandatanganan Kontrak", false],
                }[view] || ["Pokja Pemilihan", "Pembukaan Dokumen Kualifikasi", true];
                document.querySelector("#app").innerHTML = basePage(cfg[0], cfg[1], cfg[2]);
            }
            function go(v) {
                history.pushState({}, "", "#" + v);
                render(v);
            }
            window.go = go;
            window.redirect = redirect;
            window.redirectBlacklist = redirectBlacklist;
            document.querySelectorAll(".pbtn").forEach((b) => (b.onclick = () => go(b.dataset.s)));
            window.onpopstate = () => render(location.hash.slice(1)||"pokja-list");
            render(location.hash.slice(1)||"pokja-list");
        </script>
    </body>
</html>
